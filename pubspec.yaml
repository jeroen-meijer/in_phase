name: in_phase
app_name: InPhase
description: A music library management tool for creating and syncing playlists
  between Spotify and Rekordbox.
version: 1.5.1
repository: https://github.com/jeroen-meijer/in_phase

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.7.0
  clix: ^1.2.0
  collection: ^1.19.1
  crypto: ^3.0.8
  dart_console: ^5.1.2
  dcli: ^10.3.0
  doos: ^0.1.1
  drift: ^2.35.4
  equatable: '>=2.1.0 <4.0.0'
  fuzzywuzzy: ^1.2.0
  glob: ^2.2.0
  image: ^4.12.0
  intl: ^0.20.3
  io: ^1.1.0
  json_annotation: ^4.12.0
  meta: ^1.19.0
  nocterm: ^0.9.0
  oauth2: ^2.0.5
  path: ^1.9.1
  pub_semver: ^2.2.1
  pub_updater: ^0.6.0
  rekorddart: ^2.0.1
  simple_date: ^1.1.2
  spotify: ^0.16.1
  sqlite3: ^3.9.1
  tilde_expansion: ^1.1.0
  uuid: ^4.6.0
  yaml: ^3.1.4
  yaml_codec: ^1.0.0
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  json_serializable: ^6.15.2
  test: ^1.33.0
  very_good_analysis: ^11.0.0

executables:
  in_phase:

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

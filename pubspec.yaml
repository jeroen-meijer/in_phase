name: in_phase
app_name: InPhase
description: A music library management tool for creating and syncing playlists between Spotify and Rekordbox.
version: 1.1.2
repository: https://github.com/jeroen-meijer/in_phase

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  dcli: ^8.2.0
  doos: ^0.0.1
  drift: ^2.29.0
  equatable: ^2.0.7
  fuzzywuzzy: ^1.2.0
  glob: ^2.1.3
  image: ^4.5.4
  intl: ^0.20.2
  io: ^1.0.5
  json_annotation: ^4.9.0
  oauth2: ^2.0.5
  oxidized: ^6.2.0
  path: ^1.9.1
  rekorddart: ^1.1.0
  spotify: ^0.15.0
  sqlite3: ^2.9.4
  uuid: ^4.5.2
  yaml: ^3.1.3
  yaml_codec: ^1.0.0
  youtube_explode_dart: ^3.0.5

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.29.0
  json_serializable: ^6.11.1
  test: ^1.27.0
  very_good_analysis: ^10.0.0

executables:
  in_phase:

pubspec_extract:
  class_name: Pubspec
  source: pubspec.yaml
  destination: lib/src/misc/pubspec.dart
  extract-name: true
  extract-version: true

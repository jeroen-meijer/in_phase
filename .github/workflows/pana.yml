name: Pana

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pana:
    name: Pana (max score)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        id: setup-dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Cache Dart pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-${{ steps.setup-dart.outputs.dart-version }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-${{ steps.setup-dart.outputs.dart-version }}-
            ${{ runner.os }}-dart-

      - name: Install dependencies
        run: dart pub get

      - name: Run pana (fail if not full score)
        run: |
          dart pub global activate pana
          pana . --exit-code-threshold 0
